<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#bb1820" />
    <meta name="description" content="Canais oficiais da Concrefuji." />
    <title>Concrefuji | Links oficiais</title>
  </head>
  <body>
    <main class="link-page">
      <div class="background" aria-hidden="true"></div>
      <div class="ambient-shapes" aria-hidden="true">
        <span class="ambient-shape ambient-shape--red"></span>
        <span class="ambient-shape ambient-shape--white"></span>
        <span class="ambient-shape ambient-shape--concrete"></span>
      </div>
      <section class="link-card" aria-labelledby="company-name">
        <header class="brand">
          <img
            class="brand__logo"
            src="/src/img/ART%20-%20CONCREFUJI.png"
            alt="Logotipo da Concrefuji"
          />
          <div>
            <p class="brand__eyebrow">CONCTROLE TECNOLÓGICO</p>
            <h1 id="company-name">CONCREFUJI</h1>
          </div>
        </header>

        <p class="intro">Qualidade e confiança para a sua obra.</p>

        <nav id="links" class="links" aria-label="Canais de contato"></nav>

        <footer class="footer">
          <img src="/src/img/selo-iso-9001.png" alt="Certificação ISO 9001" />
          <span>Excelência em cada entrega.</span>
        </footer>
      </section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
